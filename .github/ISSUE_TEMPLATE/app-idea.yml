name: "App: new idea"
description: Something the desktop app should do, or do better.
title: "[Idea]: "
labels: ["idea", "app", "tester"]
body:
  - type: markdown
    attributes:
      value: |
        Don't put anything private in here, everyone can see it! Email me directly at evanrileyreumann@gmail.com if there is anything that you cannot share publicly here.

  - type: textarea
    id: want
    attributes:
      label: What do you want it to do (what do you want to be done or done better)?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why? What would it save you (..us, or others)?
      description: What you do now without it (another app, a spreadsheet, by hand, nothing, etc.).
    validations:
      required: true

  - type: checkboxes
    id: game
    attributes:
      label: Is the idea for a certain game (or games)?
      description: Select all that apply.
      options:
        - label: Every game
        - label: "Magic: The Gathering"
        - label: Pokémon
        - label: One Piece Card Game
        - label: Yu-Gi-Oh!
        - label: A game mncb doesn't have yet
