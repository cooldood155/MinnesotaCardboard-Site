{%- comment -%}
  Every page: the head, the header, the page, the footer. The site's own
  (no theme): it used to be minima's.
  Styles: _sass/_base.scss
{%- endcomment -%}
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body>
    <a class="skip-link" href="#main">Skip to the page</a>
    {%- include header.html -%}
    <main id="main" class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
