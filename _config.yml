title: Minnesota Cardboard
description: "Put a stack of trading cards in your scanner and Minnesota Cardboard does the rest (finds, sorts, prices and sells them the way you set it up). The app (Windows, macOS, Linux) and this site are both in development."
url: "https://mncardboard.com"
email: evanreumann@mncardboard.com
github_username: cooldood155
author: Evan R. Reumann

# "Report a problem" in the footer and on the home page (the issue forms).
report_url: "https://github.com/cooldood155/MinnesotaCardboard-Site/issues/new/choose"

include: [".well-known"]

# assets/js/local-dates.js localizes times/dates for reader's (Jekyll writes in UTC).
timezone: UTC

theme: minima

# Hides Sass warnings from minima's files.
sass:
  quiet_deps: true

# The header (title bar) menu, in order (bottom entry is furthest right).
header_pages:
  - try.html
  - news.html
  - authors.html

collections:
  # A file per author in _authors/, each with a page at /authors/<name>/.
  authors:
    output: true
    permalink: /authors/:name/

# Posts without `topic:` are app posts.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      topic: app

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Files in the repo NOT part of the site.
exclude:
  - README.md
  - DEVELOPMENT.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - node_modules
  - wrangler.jsonc
  - cms-auth
