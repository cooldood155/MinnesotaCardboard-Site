title: Minnesota Cardboard
description: "An inventory app/website for playing card collecting, researching, sharing, comparing and more (supports Magic: The Gathering, Pokémon and more). The app supports Windows, macOS and Linux. Both are currently in development."
url: "https://mncardboard.com"
email: evanreumann@mncardboard.com
github_username: cooldood155
author: Evan R. Reumann

include: [".well-known"]

# assets/js/local-dates.js localizes times/dates for reader's (Jekyll writes in UTC).
timezone: UTC

theme: minima

# Hides Sass warnings from minima's files.
sass:
  quiet_deps: true

# The header (title bar) menu, in order (bottom entry is furthest right).
header_pages:
  - news.html
  - authors.html

collections:
  # A file per author in _authors/, each with a page at /authors/<name>/.
  authors:
    output: true
    permalink: /authors/:name/

# Posts without `topic:` are app posts.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      topic: app

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Files in the repo NOT part of the site.
exclude:
  - README.md
  - DEVELOPMENT.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - node_modules
  - wrangler.jsonc
  - cms-auth
