# Site settings, read by Jekyll on every build (GitHub Pages Jekyll workflow).
title: Minnesota Cardboard
description: "An inventory app for Magic: The Gathering collections, for Windows, macOS and Linux. In development."
url: "https://mncardboard.com"
email: evanreumann@mncardboard.com
github_username: cooldood155
author: Evan R. Reumann

# Post times are written in Minnesota time and shown in the reader's time zone
# (via 'assets/feed.js').
timezone: America/Chicago

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Repository files that are not pages of the site.
exclude:
  - README.md
  - DEVELOPMENT.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - node_modules
  - wrangler.jsonc
