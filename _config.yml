title: Minnesota Cardboard
description: "Put a stack of trading cards in your scanner and Minnesota Cardboard does the rest (finds, sorts, prices and sells them the way you set it up). The app (Windows, macOS, Linux) and this site are both in development."
url: "https://mncardboard.com"
email: evanreumann@mncardboard.com
github_username: cooldood155
author: Evan R. Reumann

# "Report a problem" in the footer and on the home page (the issue forms).
report_url: "https://github.com/cooldood155/MinnesotaCardboard-Site/issues/new/choose"

# The project board: every issue and what's being worked on (the footer, the
# roadmap, the help pages, the home page and the build pages).
board_url: "https://github.com/users/cooldood155/projects/6"

include: [".well-known"]

# The site's and the app's usage stats (stats/, a Cloudflare Worker). Pages
# send to it only when built for the real site (JEKYLL_ENV=production). What's
# counted: help/usage-stats.md.
stats_url: "https://mncardboard-stats.evanrileyreumann.workers.dev"

# assets/js/local-dates.js localizes times/dates for reader's (Jekyll writes in UTC).
timezone: UTC

# No theme: the layouts, includes and styles are all the site's own
# (_layouts/, _includes/, _sass/).

# The header (title bar) menu, in order (bottom entry is furthest right).
header_pages:
  - features.md
  - try.html
  - working-build.html
  - news.html
  - help/index.md
  - authors.html

collections:
  # A file per author in _authors/, each with a page at /authors/<name>/.
  authors:
    output: true
    permalink: /authors/:name/

# Posts without `topic:` are app posts.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      topic: app

# No plugins: the feeds (feed.xml, feed/) and the link previews
# (_includes/seo.html) are the site's own.

# Files in the repo NOT part of the site.
exclude:
  - README.md
  - DEVELOPMENT.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - SUPPORT.md
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - node_modules
  - cms-auth
  - stats
  # the working-build workflow used to write this page (working-build.html is it now)
  - working-build.md
