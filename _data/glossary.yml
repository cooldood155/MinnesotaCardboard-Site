# "Words you might see" on the home page (index.md). Plain words, short. Add a
# word here whenever the site (or the app) starts using it.
- word: "Setup"
  means: "The list of things mncb does with your cards after you add them. Pick a built-in one or make your own."
- word: "Scanner"
  means: "A document scanner, the kind that pulls pages through one at a time. Lots of them can do stacks of cards as well."
- word: "Collection"
  means: "Every card mncb knows you own."
- word: "Where your cards are"
  means: "Every card in mncb is in one place at a time, just like on your desk: a binder, a deck, a box, or Unsorted. Moving a card in mncb is like moving it in real life."
- word: "Binder"
  means: "A book with plastic pages that hold cards (usually 9 to a page). For the cards you like to look at or show off."
- word: "Deck"
  means: "The cards you play a game with, like a 60-card Magic deck."
- word: "Box"
  means: "Where most cards end up: a box that holds lots of cards you don't need to look at very often."
- word: "Unsorted"
  means: "Where a new card goes until you put it somewhere else."
- word: "Condition"
  means: "How worn a card is, from Near Mint (looks brand new) to Damaged. It changes what a card is worth."
- word: "Finish"
  means: "What a card's surface looks like: plain, or something special like <i>foil</i> and <i>etched</i> (Magic) or <i>holo</i> and <i>reverse holo</i> (Pokémon). Special finishes are often worth more."
- word: "Printing"
  means: "The same card can be printed lots of times, in different sets or with different art. Each one is a printing, and they can be worth very different amounts."
- word: "Listing"
  means: "A card you've put up for sale in one or more places."
- word: "SKU"
  means: "A short code you give each card so you can find it fast when it's time to sell. Only for sellers, and only if you want them."
- word: "CSV"
  means: "A simple spreadsheet file. Other card apps can save your collection as one, and mncb can read it (also works the other way)."
- word: "Test build"
  means: "An early version of the app, just for trying it out. It's NOT finished!"
